name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: Stocks_Dictionary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build merged APK
        run: gradle :host:assembleDebug
      - name: Name the APK
        run: |
          mkdir -p out
          apk=$(find host/build/outputs/apk -name '*.apk' | head -n 1)
          cp "$apk" "out/$APP_NAME.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Stocks_Dictionary
          path: out/*.apk
          if-no-files-found: error
